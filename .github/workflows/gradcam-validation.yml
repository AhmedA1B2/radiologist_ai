name: Grad-CAM validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  python-gradcam:
    name: Python Grad-CAM graph tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_engine/requirements.txt

      - name: Install Grad-CAM dependencies
        run: python -m pip install -r python_engine/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q python_engine

      - name: Test direct and nested CNN Grad-CAM graphs
        run: python -m unittest discover -s python_engine/tests -v

  flutter-analysis:
    name: Flutter static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos
